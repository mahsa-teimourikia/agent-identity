[project]
name = "agent-identity"
version = "0.1.0"
description = "Agent Identity and Authorization Labs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "authlib>=1.3",
    "cedarpy>=4.0",
    "cryptography>=43,<47",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "jupyterlab>=4.0.0",
    "langchain>=0.3",
    "langgraph>=0.2",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "opa-python-client>=1.3",
    "openai-agents>=0.2",
    "openfga-sdk>=0.9",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-sdk>=1.27",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pyjwt[crypto]>=2.9,<3",
    "pymacaroons>=0.13",
    "pytest>=8.3",
    "PyYAML>=6.0",
    "requests>=2.32",
    "rich>=13.8",
    "tabulate>=0.9"
]

[tool.uv]
dev-dependencies = [
    "hypothesis>=6.112",
]
