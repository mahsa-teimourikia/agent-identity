name: Deploy Learning Hub

on:
  push:
    branches: [main]
    paths:
      - 'hub/**'
      - 'quiz/**'
      - 'assets/**'
      - 'curriculum/**'
      - 'scripts/build_site.py'
      - 'scripts/generate_hub_data.py'
      - 'scripts/custom_questions.py'
      - 'scripts/validate_hub.py'
      - 'scripts/learning_hub.test.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate and validate learner data
        run: |
          python3 scripts/generate_hub_data.py
          git diff --exit-code -- hub/lessons.js quiz/questions.js
          python3 scripts/validate_hub.py
          node --test scripts/learning_hub.test.js
      - name: Build Pages artifact
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
