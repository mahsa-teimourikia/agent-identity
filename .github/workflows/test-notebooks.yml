name: Validate Repository

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'curriculum/**'
      - 'hub/**'
      - 'quiz/**'
      - 'scripts/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '*.md'
  pull_request:
    paths:
      - '.github/**'
      - 'curriculum/**'
      - 'hub/**'
      - 'quiz/**'
      - 'scripts/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: '0.13.6'
          enable-cache: true
      - name: Set up minimum supported Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Synchronize locked environment
        run: make sync
      - name: Validate repository and learner surfaces
        run: make validate
      - name: Test all course implementations
        run: make test
      - name: Execute all notebooks
        run: make notebooks
      - name: Audit locked dependencies
        run: make audit
