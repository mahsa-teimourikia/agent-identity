name: Agent authorization adversarial tests
model_file: ./model.fga

tuples:
  - user: agent:claims
    relation: member
    object: tenant:acme
  - user: agent:attacker
    relation: member
    object: tenant:evil
  - user: agent:claims
    relation: reader
    object: claim:483
  # Deliberately assigned as reader: tenant intersection must still deny it.
  - user: agent:attacker
    relation: reader
    object: claim:483
  - user: tenant:acme
    relation: tenant
    object: claim:483

tests:
  - name: claims agent can read assigned claim
    check:
      - user: agent:claims
        object: claim:483
        assertions:
          can_read: true

  - name: unrelated agent cannot read claim
    check:
      - user: agent:unknown
        object: claim:483
        assertions:
          can_read: false

  - name: direct reader tuple cannot cross tenant boundary
    check:
      - user: agent:attacker
        object: claim:483
        assertions:
          can_read: false

  - name: unknown claim defaults to deny
    check:
      - user: agent:claims
        object: claim:999
        assertions:
          can_read: false
